name: Paper Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - paper-eval
    paths:
      - "paper_evaluation.py"
      - ".github/workflows/paper-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout paper-eval branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original dataset from historical commit
        run: |
          git checkout c0e884ef141ff9e6b770e5770eed7ed1ceee81e7 -- datasets/css-data
          echo "Train images: $(find datasets/css-data/train/images -type f | wc -l)"
          echo "Validation images: $(find datasets/css-data/valid/images -type f | wc -l)"
          echo "Historical test images: $(find datasets/css-data/test/images -type f | wc -l)"
          echo "Test labels: $(find datasets/css-data/test/labels -type f | wc -l)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ultralytics==8.3.9" opencv-python-headless psutil pyyaml

      - name: Run paper evaluation
        run: |
          python paper_evaluation.py \
            --repo . \
            --weights best.pt \
            --data-dir datasets/css-data \
            --out paper_eval \
            --device cpu

      - name: Show core results
        if: always()
        run: |
          echo "=== Checkpoint metadata ==="
          cat paper_eval/checkpoint_metadata.json || true
          echo "=== Aggregate metrics ==="
          cat paper_eval/aggregate_metrics.csv || true
          echo "=== Threshold sweep (compliance classes) ==="
          cat paper_eval/threshold_sweep_compliance_classes.csv || true

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-eval-results
          path: paper_eval/
          if-no-files-found: warn
          retention-days: 30
